manifest_version: '0'
name: imposter
description: Imposter on Holochain — one cloned DNA per game (its network seed names the host, or a legacy room code), N members. PeerKit carries real-time movement alongside.
roles:
  - name: game
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: ../dnas/game/workdir/game.dna
      modifiers:
        network_seed: null
        properties: null
      installed_hash: null
      clone_limit: 1000
allow_deferred_memproofs: false
bootstrap_url: null
relay_url: null

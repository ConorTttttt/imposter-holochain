name: Verify browser alpha packaging
on:
  push:
    branches: [release/browser-alpha-rc1, followup/browser-alpha-operator, followup/browser-alpha-final-acceptance]
    paths:
      - '.github/workflows/browser-alpha-package.yml'
      - 'release/browser-alpha/**'
      - 'ci/alpha-operator/**'
      - 'ci/installed-role/browser-demo.patch'
      - 'compatibility/hwc-imposter-compatibility/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release asset and deployment invariants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -v -s release/browser-alpha -p '*_test.py'
      - uses: actions/checkout@v4
        with:
          repository: ConorTttttt/imposter-holochain
          ref: 0f7b17592e682a7b7d77e9346528cba69a096cdc
          path: game
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Holo-Host/holo-web-conductor
          ref: 0c391226e78769d44ccb4661881ed8998b15f903
          path: hwc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: hwc/package-lock.json
      - name: Check player-facing provisioning and error states
        run: node --test ci/alpha-operator/browser-setup.test.mjs
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            substituters = https://holochain-ci.cachix.org https://cache.nixos.org
            trusted-public-keys = holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            max-jobs = 2
            cores = 2
      - name: Recover the accepted gateway from its pinned archive
        run: |
          python3 release/browser-alpha/gateway_archive.py fetch "$RUNNER_TEMP/gateway-archive"
          python3 release/browser-alpha/gateway_archive.py restore "$RUNNER_TEMP/gateway-archive" "$RUNNER_TEMP/h2hc-linker-linux-x86_64"
      - name: Build stock operator extension and obtain an ephemeral Lair public key
        run: |
          set -euo pipefail
          bash release/browser-alpha/build-extension.sh hwc
          (cd hwc && npx --no-install playwright install chromium)
          node release/browser-alpha/ci-host.mjs hwc > "$RUNNER_TEMP/ephemeral-host.pub"
          (cd hwc && node ../compatibility/hwc-imposter-compatibility/private-role/installed-chromium-boundary.mjs)
      - name: Exercise the operator build with CI-only identity and verify all checksums
        env:
          BROWSER_ALPHA_CI_PROFILE: '1'
        run: |
          set -euo pipefail
          host=$(cat "$RUNNER_TEMP/ephemeral-host.pub")
          seed=$(sh game/scripts/browser-poc-seed.sh "$host")
          out="$RUNNER_TEMP/alpha-ephemeral"
          bash release/browser-alpha/build.sh game hwc "$host" "$seed" "$RUNNER_TEMP/h2hc-linker-linux-x86_64" "$out"
          manifest_sha=$(sha256sum "$out/release-manifest.json" | cut -d ' ' -f 1)
          python3 release/browser-alpha/package.py verify "$out" --release-commit "$GITHUB_SHA" \
            --identity EPHEMERAL_CI_ONLY --manifest-sha256 "$manifest_sha"
          (cd "$out" && sha256sum --check SHA256SUMS)
          # Check that deploy's default provenance gate rejects an otherwise intact CI package.
          if python3 release/browser-alpha/package.py verify "$out" --release-commit "$GITHUB_SHA" >"$RUNNER_TEMP/nondeployable.log" 2>&1; then
            echo "Ephemeral package unexpectedly accepted as an operator distribution" >&2
            exit 1
          fi
          grep -Fq 'Release provenance differs' "$RUNNER_TEMP/nondeployable.log"
          PYTHONDONTWRITEBYTECODE=1 python3 - "$RUNNER_TEMP/extension-rebuild.zip" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "release/browser-alpha")
          from package import archive_extension
          archive_extension(Path("hwc/packages/extension/dist-chrome"), Path(sys.argv[1]))
          PY
          cmp "$RUNNER_TEMP/extension-rebuild.zip" "$out/chromium-hwc.zip"
          echo "HWC archive reproduction and CI deployment denial PASS"
          jq --arg sha "$manifest_sha" '{release_commit,pins,identity_provenance,external_network_acceptance,extension_version,artifacts,toolchain,release_manifest_sha256:$sha,game:{dna_hash:.game.dna_hash,happ_bundle_sha256:.game.happ_bundle_sha256}}' "$out/release-manifest.json" > "$RUNNER_TEMP/package-checks.json"
          cat "$RUNNER_TEMP/package-checks.json"
      - name: Verify HTTPS/WSS rollback and durable gateway restart on loopback
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/alpha-caddy"
          mkdir "$tools"
          file=caddy_2.10.2_linux_amd64.tar.gz
          gh release download v2.10.2 -R caddyserver/caddy -D "$tools" -p "$file"
          printf '%s  %s\n' 747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546 "$tools/$file" | sha512sum --check
          tar -xzf "$tools/$file" -C "$tools" caddy
          python3 ci/alpha-operator/smoke.py "$RUNNER_TEMP/alpha-ephemeral" "$GITHUB_SHA" \
            "$tools/caddy" "$RUNNER_TEMP/operator-checks.json"
      - name: Verify provisioning and restart of both exact native authorities
        working-directory: game
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          nix --extra-experimental-features 'nix-command flakes' develop --no-write-lock-file --command \
            python3 "$GITHUB_WORKSPACE/ci/alpha-operator/native-smoke.py" \
            "$RUNNER_TEMP/alpha-ephemeral" "$GITHUB_SHA" "$RUNNER_TEMP/operator-native-checks.json"
      - name: Upload packaging evidence only
        uses: actions/upload-artifact@v4
        with:
          name: browser-alpha-packaging-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/package-checks.json
            ${{ runner.temp }}/operator-checks.json
            ${{ runner.temp }}/operator-native-checks.json
          if-no-files-found: error

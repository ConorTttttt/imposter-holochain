name: Imposter mobile UI checks
on:
  pull_request:
    paths:
      - 'ui/**'
      - 'apps/imposter-mobile/**'
      - '.github/workflows/mobile-ui.yml'
  push:
    branches:
      - feature/android-mobile-foundation

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  native-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build Vite frontend for the embedded Tauri context
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      - name: Generate Tauri app icons
        run: |
          cd apps/imposter-mobile
          npm install
          npx tauri icon branding/icon.svg
      - name: Test native IPC validation
        run: cargo test --manifest-path apps/imposter-mobile/src-tauri/Cargo.toml --lib

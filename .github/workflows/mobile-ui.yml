name: Imposter mobile UI checks
on:
  pull_request:
    paths:
      - 'ui/**'
      - 'apps/imposter-mobile/**'
      - '.github/workflows/mobile-ui.yml'
  push:
    branches:
      - feature/android-mobile-foundation

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

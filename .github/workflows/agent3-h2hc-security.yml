name: Agent 3 - pinned H2HC P0 security (real Rust)
on:
  push:
    branches: [ci/agent3-h2hc-security-validation]
    paths:
      - '.github/workflows/agent3-h2hc-security.yml'
      - 'ci/agent3-h2hc-kit/apply_revocation_patch.py'
      - 'ci/agent3-h2hc-kit/apply_private_role_relay.py'
      - 'ci/agent3-h2hc-kit/private_role.rs'
      - 'ci/agent3-h2hc-kit/native-role-vectors.rs'
      - 'ci/agent3-h2hc-kit/generate_role_vectors.py'
      - 'ci/agent3-h2hc-kit/verify-role-vectors.mjs'
      - 'ci/agent3-h2hc-kit/fixtures/role-public-vectors-v1-candidate.json.gz.base64'
      - 'ci/agent3-h2hc-kit/network-role-probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent3-h2hc-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cargo-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out CI validation branch (never main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out exact upstream H2HC source
        uses: actions/checkout@v4
        with:
          repository: Holo-Host/h2hc-linker
          ref: cab242d32c988fe5e4e9fd06ebc82ed043541aa2
          path: h2hc
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate standalone H2HC checkout from Imposter Cargo workspace
        run: cp -a h2hc "$RUNNER_TEMP/h2hc"

      - name: Verify signed-off source and decode complete source kit
        run: |
          set -euo pipefail
          test "$(git -C "$RUNNER_TEMP/h2hc" rev-parse HEAD)" = cab242d32c988fe5e4e9fd06ebc82ed043541aa2
          cat ci/agent3-h2hc-kit/part00.b64 ci/agent3-h2hc-kit/part01.b64 ci/agent3-h2hc-kit/part02.b64 | base64 --decode > "$RUNNER_TEMP/h2hc-security-kit.tar.xz"
          echo "afcf5c406b6b6040ac00060d31052a9eaa121c5b8540ca6a7354898b6752be62  $RUNNER_TEMP/h2hc-security-kit.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/h2hc-security-kit.tar.xz" -C "$GITHUB_WORKSPACE"
          python3 -m py_compile agent3-h2hc-patches/apply_security_patches.py
          echo "CI source: $(git rev-parse HEAD)"
          echo "Pinned H2HC: $(git -C "$RUNNER_TEMP/h2hc" rev-parse HEAD)"

      - name: Apply three existing security transformations to pinned checkout
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/h2hc"
          git config user.name 'Agent 3 security CI'
          git config user.email 'agent3-security-ci@users.noreply.github.com'
          bash "$GITHUB_WORKSPACE/agent3-h2hc-patches/run_security_checks.sh" --apply-only | tee "$RUNNER_TEMP/h2hc-apply.log"
          echo "Applied H2HC SHA $(git rev-parse HEAD)"
          git log --oneline -4
          git status --porcelain
          git diff cab242d32c988fe5e4e9fd06ebc82ed043541aa2...HEAD --stat

      - name: Apply integration fixes identified by real Rust compiler (E0425, E0382)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          root = Path(os.environ["RUNNER_TEMP"]) / "h2hc"
          gateway = root / "src/gateway_kitsune.rs"
          content = gateway.read_text()
          old = "let signal_data = signal_to_b64(&ExternIO(signal.zome_call_params.clone()));"
          new = "let signal_data = base64::engine::general_purpose::STANDARD.encode(&signal.zome_call_params);"
          assert content.count(old) == 1, "unexpected gateway signal encoder source"
          assert "use base64::Engine;" not in content, "encoder import unexpectedly present"
          content = content.replace(old, new, 1)
          content = content.replace("use bytes::Bytes;", "use base64::Engine;\nuse bytes::Bytes;", 1)
          gateway.write_text(content)

          websocket = root / "src/routes/websocket.rs"
          content = websocket.read_text()
          old = "state.registrations.push(key);"
          assert content.count(old) == 1, "unexpected registration ownership source"
          websocket.write_text(content.replace(old, "state.registrations.push(key.clone());", 1))
          subprocess.run(["git", "-C", str(root), "add", "src/gateway_kitsune.rs", "src/routes/websocket.rs"], check=True)
          subprocess.run(["git", "-C", str(root), "commit", "-m", "security: fix signal encoder and registration key ownership"], check=True)
          subprocess.run(["git", "-C", str(root), "diff", "--check"], check=True)
          PY

      - name: Fix regression tests and targeted strict-Clippy failures from real Cargo run
        run: |
          set -euo pipefail
          python3 ci/agent3-h2hc-kit/apply_rust_regression_fixes.py --repo "$RUNNER_TEMP/h2hc"
          git -C "$RUNNER_TEMP/h2hc" add src/router.rs src/routes/websocket.rs src/auth/middleware.rs src/config.rs src/gateway_kitsune.rs src/lib.rs
          git -C "$RUNNER_TEMP/h2hc" commit -m "security: correct Rust regression fixtures and targeted Clippy errors"
          git -C "$RUNNER_TEMP/h2hc" diff --check

      - name: Apply fail-closed revocation patch without modifying upstream pin
        run: |
          set -euo pipefail
          python3 ci/agent3-h2hc-kit/apply_revocation_patch.py --repo "$RUNNER_TEMP/h2hc"
          git -C "$RUNNER_TEMP/h2hc" add src/auth/store.rs src/auth/memory_store.rs src/routes/websocket.rs
          git -C "$RUNNER_TEMP/h2hc" commit -m "security: revoke every active websocket and close session race"
          git -C "$RUNNER_TEMP/h2hc" diff --check
          git -C "$RUNNER_TEMP/h2hc" rev-parse HEAD

      - name: Install pinned Rust toolchain with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy

      - name: Install Holochain native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config build-essential

      - name: Cache pinned Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/h2hc
          cache-on-failure: true

      - name: Format generated Rust sources
        working-directory: ${{ runner.temp }}/h2hc
        run: |
          set -euo pipefail
          cargo fmt
          git diff --stat
          git diff --check

      - name: Apply restricted role relay, format and pin the exact generated Rust tree
        run: |
          set -euo pipefail
          python3 ci/agent3-h2hc-kit/apply_private_role_relay.py --repo "$RUNNER_TEMP/h2hc"
          cd "$RUNNER_TEMP/h2hc"
          cargo fmt
          git add src
          git diff --cached --check
          git commit -m "security: bounded opaque role-request and role-delivery relay"
          echo "Private relay H2HC SHA: $(git rev-parse HEAD)"
          git status --porcelain

      - name: cargo fmt --check
        working-directory: ${{ runner.temp }}/h2hc
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/h2hc-fmt.log"

      - name: cargo test --locked
        working-directory: ${{ runner.temp }}/h2hc
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/h2hc-test.log"

      - name: cargo clippy --locked --all-targets -- -D warnings
        if: success() || failure()
        working-directory: ${{ runner.temp }}/h2hc
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/h2hc-clippy.log"

      - name: Generate deterministic RFC9180 HPKE vectors and verify with native Holochain 0.7 Rust
        working-directory: ${{ runner.temp }}/h2hc
        run: |
          set -euo pipefail
          mkdir -p examples "$GITHUB_WORKSPACE/ci-evidence"
          cp "$GITHUB_WORKSPACE/ci/agent3-h2hc-kit/native-role-vectors.rs" examples/agent3_role_vectors.rs
          cargo fmt
          cargo fmt --check
          cargo run --locked --example agent3_role_vectors -- --hashes > "$RUNNER_TEMP/role-public-hashes.json"
          python3 -m venv "$RUNNER_TEMP/role-vector-venv"
          "$RUNNER_TEMP/role-vector-venv/bin/pip" install -q cryptography==46.0.4
          "$RUNNER_TEMP/role-vector-venv/bin/python" "$GITHUB_WORKSPACE/ci/agent3-h2hc-kit/generate_role_vectors.py" "$RUNNER_TEMP/role-public-hashes.json" "$RUNNER_TEMP/role-public-vectors.json"
          cargo run --locked --example agent3_role_vectors -- "$RUNNER_TEMP/role-public-vectors.json"
          # Independent Node crypto verifier consumes native Rust/Python vectors.
          node --version
          node "$GITHUB_WORKSPACE/ci/agent3-h2hc-kit/verify-role-vectors.mjs" "$RUNNER_TEMP/role-public-vectors.json" "$GITHUB_WORKSPACE/ci/agent3-h2hc-kit/fixtures/role-public-vectors-v1-candidate.json.gz.base64"
          node "$GITHUB_WORKSPACE/ci/agent3-h2hc-kit/verify-role-vectors.mjs" "$GITHUB_WORKSPACE/ci/agent3-h2hc-kit/fixtures/role-public-vectors-v1-candidate.json.gz.base64"
          cargo clippy --locked --example agent3_role_vectors -- -D warnings
          cp "$RUNNER_TEMP/role-public-vectors.json" "$GITHUB_WORKSPACE/ci-evidence/role-public-vectors.json"
          echo "HPKE_ROLE_VECTORS=PASS"

      - name: Collect source commits and final Git diff
        if: always()
        run: |
          mkdir -p ci-evidence
          git -C "$RUNNER_TEMP/h2hc" log -5 --format='%H %s' > ci-evidence/h2hc-commits.txt 2>/dev/null || true
          git -C "$RUNNER_TEMP/h2hc" diff cab242d32c988fe5e4e9fd06ebc82ed043541aa2 > ci-evidence/h2hc-source-diff.patch 2>/dev/null || true
          git -C "$RUNNER_TEMP/h2hc" status --short > ci-evidence/h2hc-status.txt 2>/dev/null || true
          for file in h2hc-apply.log h2hc-fmt.log h2hc-test.log h2hc-clippy.log; do
            if test -e "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "ci-evidence/$file"; fi
          done

      - name: Upload Rust source and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-h2hc-p0-security-${{ github.run_id }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

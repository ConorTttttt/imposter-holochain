name: Agent 3 - pinned native enrollment + trusted receiver preflight (NOT E2E)
on:
  push:
    branches: [ci/agent3-h2hc-security-validation]
    paths:
      - '.github/workflows/agent3-role-e2e-integration.yml'
  workflow_dispatch:
    inputs:
      require_encrypted_delivery:
        description: Require the currently missing genuine trusted receiver
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  pinned-gateway-and-crypto:
    name: Pinned gateway and Agent 2 crypto/Lair (NOT a role receipt)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ConorTttttt/imposter-holochain
          ref: 83709f1cce4e944d3e95db1368aa6b89966cee8b
          path: agent2-kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ConorTttttt/imposter-holochain
          ref: 0f7b17592e682a7b7d77e9346528cba69a096cdc
          fetch-depth: 0
          path: agent4-kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Holo-Host/holo-web-conductor
          ref: 0c391226e78769d44ccb4661881ed8998b15f903
          path: hwc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hwc/package-lock.json
      - name: Verify independent exact source pins and unchanged HWC remote-signal rejection
        run: |
          set -euo pipefail
          test "$(git -C agent2-kit rev-parse HEAD)" = 83709f1cce4e944d3e95db1368aa6b89966cee8b
          test "$(git -C agent4-kit rev-parse HEAD)" = 0f7b17592e682a7b7d77e9346528cba69a096cdc
          test "$(git -C hwc rev-parse HEAD)" = 0c391226e78769d44ccb4661881ed8998b15f903
          # Only the new API document changed after Agent 4's accepted
          # native coordinator run 44320254863 (tested d93520f57c2).
          git -C agent4-kit diff --exit-code d93520f57c2f3fcb190ebf55a3c79d1dec4eb2d1 HEAD -- dnas/game/zomes/coordinator/game/src/lib.rs dnas/game/zomes/integrity/game_integrity/src tests/tests/full_round.rs
          test -s agent4-kit/crates/imposter-core/src/role_auth.rs
          test -s agent4-kit/dnas/game/zomes/integrity/game_integrity/src/recipient_keys.rs
          test -s agent4-kit/dnas/game/zomes/coordinator/game/src/recipient_keys.rs
          grep -Fq 'IMPOSTER-H2HC-ROLE-KEY' agent4-kit/dnas/game/zomes/integrity/game_integrity/src/recipient_keys.rs
          grep -Fq 'current_unproven: true' agent4-kit/dnas/game/zomes/coordinator/game/src/recipient_keys.rs
          for symbol in get_authoritative_game_view commit_roles_only host_role_opening; do
            grep -Fq "pub fn $symbol" agent4-kit/dnas/game/zomes/coordinator/game/src/lib.rs
          done
          for name in native-state.mjs native-authority.mjs native-authority.test.mjs; do
            test -s "agent2-kit/compatibility/hwc-imposter-compatibility/private-role/$name"
          done
          grep -Fq 'get_authoritative_game_view' agent2-kit/compatibility/hwc-imposter-compatibility/private-role/native-authority.mjs
          grep -Fq 'host_role_opening' agent2-kit/compatibility/hwc-imposter-compatibility/private-role/native-authority.mjs
          for name in installed-cell.mjs installed-native-enrollment.mjs native-enrollment.mjs trusted-receiver.mjs store.mjs request-attestation.mjs merkle.mjs apply_restricted_hwc_handler.py; do
            test -s "agent2-kit/compatibility/hwc-imposter-compatibility/private-role/$name"
          done
          grep -Fq NATIVE_ROLE_STATE_BRIDGE_UNAVAILABLE agent2-kit/compatibility/hwc-imposter-compatibility/private-role/apply_restricted_hwc_handler.py
          echo 'PINNED_NATIVE_ENROLLMENT_AND_RESTRICTED_RECEIVER_SOURCE=PASS; INSTALLED_RECEIPT=BLOCKED'
          grep -Fq 'Remote signal rejected: authenticated H2HC envelope unavailable' agent2-kit/compatibility/hwc-imposter-compatibility/apply.py
          mkdir -p acceptance-evidence "$RUNNER_TEMP/public-vector"
          base64 -d ci/agent3-h2hc-kit/fixtures/role-public-vectors-v1-candidate.json.gz.base64 | gzip -dc > "$RUNNER_TEMP/public-vector/agent3.json"
          base64 -d agent2-kit/compatibility/hwc-imposter-compatibility/private-role/agent3-role-public-vectors-v1-candidate.json.gz.base64 | gzip -dc > "$RUNNER_TEMP/public-vector/agent2.json"
          printf '%s  %s\n' 065435eee01a44b2111627636136efa21a777954de8cd86786d0d8d044fbd6e4 "$RUNNER_TEMP/public-vector/agent3.json" | sha256sum --check
          cmp "$RUNNER_TEMP/public-vector/agent3.json" "$RUNNER_TEMP/public-vector/agent2.json"
          echo 'REV2_CROSS_BRANCH_FIXTURE=PASS; TRUSTED_RECEIVER=NOT_TESTED'
      - name: Verify gateway artifact identity, source and accepted run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ConorTttttt/imposter-holochain/actions/artifacts/14428255589 | jq -e '.id == 14428255589 and .expired == false and .name == "agent3-h2hc-p0-security-44304976936" and .workflow_run.id == 44304976936 and .workflow_run.head_sha == "293563649f7fd18a6bc2e0d1426c31132bf2b8c7"' >/dev/null
          gh api repos/ConorTttttt/imposter-holochain/actions/runs/44304976936 | jq -e '.conclusion == "success" and .head_sha == "293563649f7fd18a6bc2e0d1426c31132bf2b8c7"' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          repository: ConorTttttt/imposter-holochain
          run-id: 44304976936
          name: agent3-h2hc-p0-security-44304976936
          github-token: ${{ github.token }}
          path: gateway-artifact
      - name: Verify actual executable, generated H2HC commit, native fixture and scope
        run: |
          set -euo pipefail
          dir=gateway-artifact/role-gateway
          (cd "$dir" && sha256sum --check SHA256SUMS)
          printf '%s  %s\n' 8f3f8e0b6a6fc02b27776182458cf0d970bc02f76db9f6f6b6842c04f138746f "$dir/h2hc-linker-linux-x86_64" | sha256sum --check
          test "$(cat "$dir/h2hc-applied-source-commit.txt")" = 9f5eb04b5be12e3e9e7fcc304bd905da1449ade9
          grep -Fxq 'SOURCE_H2HC=9f5eb04b5be12e3e9e7fcc304bd905da1449ade9' "$dir/build-provenance.txt"
          grep -Fxq 'SOURCE_IMPOSTER=293563649f7fd18a6bc2e0d1426c31132bf2b8c7' "$dir/build-provenance.txt"
          grep -Fxq 'ROLE_GATEWAY_THREE_AGENT_NETWORK=PASS; HWC_RECEIVER=NOT_TESTED' "$dir/role-smoke-result.txt"
          printf '%s  %s\n' 065435eee01a44b2111627636136efa21a777954de8cd86786d0d8d044fbd6e4 gateway-artifact/role-public-vectors.json | sha256sum --check
          echo 'ROLE_GATEWAY_PINNED_BYTES=PASS; HWC_RECEIVER=NOT_TESTED'
      - name: Agent 2 isolated cryptography, trusted receiver, durable replay and epoch tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/idb"
          printf '{"name":"idb-only","private":true}\n' > "$RUNNER_TEMP/idb/package.json"
          npm install --prefix "$RUNNER_TEMP/idb" --no-save --ignore-scripts --package-lock=false --no-audit --no-fund fake-indexeddb@6.2.5
          node --import "$RUNNER_TEMP/idb/node_modules/fake-indexeddb/auto/index.mjs" --test agent2-kit/compatibility/hwc-imposter-compatibility/private-role/*.test.mjs
      - name: Genuine pinned Lair fixture signing (NOT installed game cell)
        timeout-minutes: 16
        run: |
          set -euo pipefail
          npm ci --prefix hwc
          npm run build --prefix hwc --workspace=@holo-host/lair
          node agent2-kit/compatibility/hwc-imposter-compatibility/private-role/lair-signing-acceptance.mjs
      - name: Explicitly publish only safe component-level preflight verdict
        if: success()
        run: |
          mkdir -p acceptance-evidence
          cat > acceptance-evidence/preflight.json <<'JSON'
          {"scope":"PINNED_GATEWAY_AND_ISOLATED_RECEIVER_CRYPTO_ONLY","agent2_source":"83709f1cce4e944d3e95db1368aa6b89966cee8b","agent4_source":"0f7b17592e682a7b7d77e9346528cba69a096cdc","gateway_artifact_id":14428255589,"gateway_sha256":"8f3f8e0b6a6fc02b27776182458cf0d970bc02f76db9f6f6b6842c04f138746f","native_fixture_sha256":"065435eee01a44b2111627636136efa21a777954de8cd86786d0d8d044fbd6e4","receiver_accepted":false,"role_e2e":"BLOCKED","contains_role_plaintext_or_private_keys":false}
          JSON
          echo '## Signed-role integration preflight' >> "$GITHUB_STEP_SUMMARY"
          echo 'Gateway binary, native vectors and Agent 2 genuine Lair fixture signing PASS only at their component boundary.' >> "$GITHUB_STEP_SUMMARY"
          echo '**E2E BLOCKED**: no installed-cell native recipient-key discovery or trusted HWC receiver. Gateway role_queued_v1 is not receipt.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive only allowlisted non-secret preflight status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-role-cross-branch-preflight-${{ github.run_id }}
          path: acceptance-evidence/preflight.json
          retention-days: 14
          if-no-files-found: ignore
  native-recipient-attestation:
    name: Native 0.7 recipient-key attestation and exact RoleCommit boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ConorTttttt/imposter-holochain
          ref: 0f7b17592e682a7b7d77e9346528cba69a096cdc
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact native recipient-key source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0f7b17592e682a7b7d77e9346528cba69a096cdc
          grep -Fq 'current_unproven: true' dnas/game/zomes/coordinator/game/src/recipient_keys.rs
          grep -Fq 'IMPOSTER-H2HC-ROLE-KEY' dnas/game/zomes/integrity/game_integrity/src/recipient_keys.rs
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            substituters = https://holochain-ci.cachix.org https://cache.nixos.org
            trusted-public-keys = holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            max-jobs = 2
            cores = 2
      - name: Compile production and forge-negative native game DNA
        timeout-minutes: 45
        run: |
          set -euo pipefail
          nix -L develop --no-write-lock-file --command bash -euo pipefail -c '
            bash scripts/build-forge-dna.sh
            test -s dnas/game/workdir/game.dna
            test -s tests/forge/game.dna
            cargo test --locked -p game_integrity recipient_keys::tests -- --nocapture
          '
      - name: Independent native signing, lookup, rotation and rejected foreign author
        timeout-minutes: 35
        run: |
          set -euo pipefail
          nix -L develop --no-write-lock-file --command cargo test --locked -p game_tests --test full_round recipient_key_native_two_conductors_attest_discover_and_rotate -- --nocapture > "$RUNNER_TEMP/native-enrollment.log" 2>&1 || {
            echo "::error::Native enrollment two-conductor test failed"
            exit 1
          }
          for gate in RECIPIENT_ATTESTATION_NATIVE_VALID RECIPIENT_ATTESTATION_HOST_LOOKUP RECIPIENT_ATTESTATION_IMPERSONATION_DENIED RECIPIENT_ATTESTATION_STALE_FLOOR_DENIED; do
            grep -Fq "$gate=PASS" "$RUNNER_TEMP/native-enrollment.log"
          done
          grep -Fq 'RECIPIENT_ATTESTATION_GLOBAL_FRESHNESS=UNPROVEN' "$RUNNER_TEMP/native-enrollment.log"
          mkdir -p acceptance-evidence
          echo '{"scope":"NATIVE_TWO_CONDUCTOR_PUBLIC_ENROLLMENT","source":"0f7b17592e682a7b7d77e9346528cba69a096cdc","native_validation":"PASS","attested_lookup":"PASS","foreign_agent_denial":"PASS","stale_floor_denial":"PASS","global_latest_key":"UNPROVEN","browser_receipt":"BLOCKED"}' > acceptance-evidence/native.json
          echo 'NATIVE_RECIPIENT_ENROLLMENT=PASS; GLOBAL_FRESHNESS=UNPROVEN'
      - name: Independently validate native RoleCommit and denial cases (not role delivery)
        timeout-minutes: 35
        run: |
          set -euo pipefail
          nix -L develop --no-write-lock-file --command cargo test --locked -p game_tests --test full_round native_game_role_commit_boundary -- --nocapture > "$RUNNER_TEMP/native-rolecommit.log" 2>&1 || {
            echo "::error::Native RoleCommit acceptance failed (see local runner log)"; exit 1
          }
          for gate in NATIVE_GAME_VALID_LOBBY_AND_JOINS NATIVE_GAME_EXACT_COMMIT_INDEPENDENT_READ NATIVE_GAME_NO_SIGNAL_COMMIT_AND_IDEMPOTENT_RETRY NATIVE_GAME_WRONG_HOST_DENIED NATIVE_GAME_WRONG_LOBBY_DENIED NATIVE_GAME_WRONG_RECIPIENT_SEAT_DENIED NATIVE_GAME_STALE_COMMIT_DENIED NATIVE_GAME_MISMATCHED_JOIN_NATIVE_INVALID NATIVE_GAME_INVALID_RECORD_FAIL_CLOSED; do
            grep -Fq "$gate=PASS" "$RUNNER_TEMP/native-rolecommit.log"
          done
          grep -Eq '^NATIVE_ROLE_COMMIT_ACTION=uhCkk[A-Za-z0-9_-]+' "$RUNNER_TEMP/native-rolecommit.log"
          mkdir -p acceptance-evidence
          echo '{"scope":"NATIVE_ROLECOMMIT_ONLY","source":"0f7b17592e682a7b7d77e9346528cba69a096cdc","tested_coordinator":"d93520f57c2f3fcb190ebf55a3c79d1dec4eb2d1","valid_lobby_and_joins":true,"independent_commit_read":true,"host_only_and_idempotent":true,"wrong_host_lobby_seat_and_stale_denied":true,"invalid_join_denied":true,"encrypted_role_received":false,"global_commit_finality":"UNPROVEN"}' > acceptance-evidence/rolecommit.json
          echo 'NATIVE_ROLECOMMIT_CONTRACT=PASS; INSTALLED_HWC_RECEIPT=NOT_EXECUTED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-role-native-attestation-${{ github.run_id }}
          path: |
            acceptance-evidence/native.json
            acceptance-evidence/rolecommit.json
          retention-days: 14
          if-no-files-found: ignore

  installed-hwc-staging:
    name: Installed HWC Chrome build with restricted role-handler DENY ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ConorTttttt/imposter-holochain
          ref: 83709f1cce4e944d3e95db1368aa6b89966cee8b
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Holo-Host/holo-web-conductor
          ref: 0c391226e78769d44ccb4661881ed8998b15f903
          path: hwc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hwc/package-lock.json
      - name: Assert immutable HWC security patch and deny-only installed receiver
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 83709f1cce4e944d3e95db1368aa6b89966cee8b
          test "$(git -C hwc rev-parse HEAD)" = 0c391226e78769d44ccb4661881ed8998b15f903
          python3 compatibility/hwc-imposter-compatibility/verify_pinned_sources.py hwc
          python3 compatibility/hwc-imposter-compatibility/apply.py hwc --check
          git -C hwc switch -c fix/imposter-hwc-compatibility
          python3 compatibility/hwc-imposter-compatibility/apply.py hwc --write
          python3 compatibility/hwc-imposter-compatibility/private-role/apply_restricted_hwc_handler.py hwc --check
          python3 compatibility/hwc-imposter-compatibility/private-role/apply_restricted_hwc_handler.py hwc --write
          grep -Fq NATIVE_ROLE_STATE_BRIDGE_UNAVAILABLE hwc/packages/extension/src/background/index.ts
          grep -Fq PRIVATE_ROLE_SENDER_REJECTED hwc/packages/extension/src/background/index.ts
          grep -Fq 'Remote signal rejected: authenticated H2HC envelope unavailable' hwc/packages/extension/src/background/index.ts
          grep -Fq 'Unauthenticated remote provenance' hwc/packages/core/src/ribosome/index.ts
          git -C hwc diff --check
      - name: Typecheck HWC runtime and build real Chrome extension
        timeout-minutes: 20
        run: |
          set -euo pipefail
          npm ci --prefix hwc
          (cd hwc &&
            npx tsc -p packages/shared/tsconfig.json &&
            npx tsc -p packages/lair/tsconfig.json &&
            npx tsc -p packages/core/tsconfig.json &&
            npx tsc --noEmit -p packages/extension/tsconfig.json &&
            npm run build:chrome --workspace @hwc/extension)
          test -s hwc/packages/extension/dist-chrome/manifest.json
          test -s hwc/packages/extension/dist-chrome/background/index.js
          mkdir -p acceptance-evidence
          echo '{"scope":"REAL_HWC_CHROME_BUILD","agent2_source":"83709f1cce4e944d3e95db1368aa6b89966cee8b","restricted_role_frames":"PASS_DENY_ONLY","trusted_native_role_bridge":"BLOCKED","generic_remote_calls":"DISABLED"}' > acceptance-evidence/hwc.json
          echo 'REAL_HWC_RESTRICTED_ROLE_FRAME_BUILD=PASS_DENY_ONLY; TRUSTED_ROLE_BRIDGE=BLOCKED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-role-hwc-staging-${{ github.run_id }}
          path: acceptance-evidence/hwc.json
          retention-days: 14
          if-no-files-found: ignore

  strict-native-e2e:
    needs: [pinned-gateway-and-crypto, native-recipient-attestation, installed-hwc-staging]
    if: always()
    name: Genuine installed HWC role receipt (strict, BLOCKED is CI failure)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Strictly reject missing installed role receipt and key freshness
        env:
          GATEWAY_CRYPTO: ${{ needs.pinned-gateway-and-crypto.result }}
          NATIVE_ENROLLMENT: ${{ needs.native-recipient-attestation.result }}
          HWC_STAGING: ${{ needs.installed-hwc-staging.result }}
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          echo '{"scope":"THREE_INSTALLED_HWC_ROLE_ACCEPTANCE","status":"BLOCKED","native_valid_game_state":"COMPONENT_ONLY","recipient_key_attestation":"COMPONENT_ONLY","fresh_recipient_key_confirmation":false,"gateway_delivery_enqueue":"NOT_EXECUTED","guest_b_signature_verification":"NOT_EXECUTED","guest_b_hpke_decryption":"NOT_EXECUTED","guest_b_seat_merkle_verification":"NOT_EXECUTED","guest_b_extension_local_acceptance":false,"guest_c_denial_executed":false,"wrong_host_dna_seat_commit_denied_in_browser":false,"key_epoch_rollback_denied_in_browser":false,"request_reply_correlation_in_browser":false,"durable_replay_executed":false,"revocation_pending_delivery_executed":false,"unrelated_agent_isolation_in_role_delivery":false,"gateway_queued_is_receipt":false,"private_material_archived":false}' > acceptance-evidence/strict.json
          echo "COMPONENT_STATUS: gateway=$GATEWAY_CRYPTO; native=$NATIVE_ENROLLMENT; hwc=$HWC_STAGING"
          echo "::error::E2E_BLOCKED: latest Agent 2 HWC patch still returns NATIVE_ROLE_STATE_BRIDGE_UNAVAILABLE. Agent 4 native game view exists and is observed_only, but no privileged installed receiver has decrypted a role, and no live installed recipient-key freshness confirmation was executed."
          echo 'role_queued_v1 is NOT a guest result; refusing synthetic PASS.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-role-strict-e2e-${{ github.run_id }}
          path: acceptance-evidence/strict.json
          retention-days: 14
          if-no-files-found: ignore

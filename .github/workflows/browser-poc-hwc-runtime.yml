name: "Agent 4 — three isolated HWC browsers + authenticated H2HC P0"
on:
  push:
    branches: [feature/browser-compatibility-harness]
    paths:
      - ".github/workflows/browser-poc-hwc-runtime.yml"
      - "scripts/browser-poc-hwc-smoke.mjs"
      - "scripts/browser-poc-hwc-three-profiles.mjs"
      - "docs/browser-poc-three-profile-p0.md"
      - "scripts/browser-poc-lib.mjs"
      - "scripts/browser-poc-ci-worker-probe.mjs"
      - "docs/browser-poc-runbook.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent4-real-hwc-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  static-harness-validation:
    name: "Preflight syntax and packaging tests (no DHT claims)"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and baseline immutable packager regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/browser-poc-hwc-three-profiles.mjs
          node --check scripts/browser-poc-hwc-smoke.mjs
          node --test scripts/browser-poc.test.mjs

  real-hwc-first-cell:
    name: "Three genuine HWC/Lair profiles, same DNA, signed H2HC sessions (DHT gated)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BROWSER_POC_IDENTITY_SOURCE: EPHEMERAL_HWC_BROWSER_PROFILE
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout Agent 4 harness and pinned source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Agent 2 accepted composite-entry HWC migration patch kit
        uses: actions/checkout@v4
        with:
          repository: ConorTttttt/imposter-holochain
          ref: bc55d2a2fd9cc4da6c384f086e261f3ffa27cb39
          path: agent2-kit
          persist-credentials: false

      - name: Checkout EXACT pinned HWC source
        uses: actions/checkout@v4
        with:
          repository: Holo-Host/holo-web-conductor
          ref: 0c391226e78769d44ccb4661881ed8998b15f903
          path: hwc
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source pins and prepare clean local patch branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hwc rev-parse HEAD)" = "0c391226e78769d44ccb4661881ed8998b15f903"
          test "$(git -C agent2-kit rev-parse HEAD)" = "bc55d2a2fd9cc4da6c384f086e261f3ffa27cb39"
          git -C hwc switch -c fix/imposter-hwc-compatibility
          python3 agent2-kit/compatibility/hwc-imposter-compatibility/apply.py hwc --check
          python3 agent2-kit/compatibility/hwc-imposter-compatibility/apply.py hwc --write
          git -C hwc diff --check
          # Fail closed on stale pre-issue-#7 extension code or a missing migration.
          test -s hwc/packages/core/src/storage/sqlite-entry-migration.ts
          grep -Fq 'PRIMARY KEY (cell_id, entry_hash)' hwc/packages/core/src/storage/sqlite-schema.ts
          grep -Fq 'migrateEntrySchema' hwc/packages/extension/src/offscreen/ribosome-worker.ts
          grep -Fq 'ON CONFLICT(cell_id, entry_hash) DO NOTHING' hwc/packages/extension/src/offscreen/ribosome-worker.ts
          grep -Fq "keyPath: ['cellId', 'entryHash']" hwc/packages/core/src/storage/source-chain-storage.ts
          mkdir -p runtime-evidence
          printf '%s\n' 'upstream_hwc=0c391226e78769d44ccb4661881ed8998b15f903' 'agent2_migration_patch=bc55d2a2fd9cc4da6c384f086e261f3ffa27cb39' 'migration_schema=composite_cell_id_entry_hash' 'collision_acceptance=Agent2 headed Chrome run 44191974895 (independent CI; not re-executed here)' > runtime-evidence/hwc-migration-provenance.txt
          echo 'P0_MIGRATION_SOURCE_PIN_VERIFIED PASS composite SQLite and IndexedDB migrations present'
          git -C hwc diff --stat > runtime-evidence/patched-hwc-diff-stat.txt
          git -C hwc status --short >> runtime-evidence/patched-hwc-diff-stat.txt

      # Immutable, previously executed secure gateway; NOT native DHT authority.
      - name: Download Agent 3 signed-op H2HC gateway binary from known-good run
        uses: actions/download-artifact@v4
        with:
          repository: ConorTttttt/imposter-holochain
          run-id: 44165793922
          name: agent3-h2hc-authenticated-runtime-44165793922
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: h2hc-binary

      - name: Verify exact H2HC executable checksum and patch provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s h2hc-binary/h2hc-linker-linux-x86_64
          expected="$(head -1 h2hc-binary/SHA256SUMS | awk '{print $1}')"
          actual="$(sha256sum h2hc-binary/h2hc-linker-linux-x86_64 | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(sed -n 's/^SOURCE_H2HC=//p' h2hc-binary/build-provenance.txt)" = "$(cat h2hc-binary/h2hc-applied-source-commit.txt)"
          grep -Fq cab242d32c988fe5e4e9fd06ebc82ed043541aa2 h2hc-binary/RUNTIME_RUNBOOK.md
          chmod +x h2hc-binary/h2hc-linker-linux-x86_64
          mkdir -p runtime-evidence
          sha256sum h2hc-binary/h2hc-linker-linux-x86_64 > runtime-evidence/h2hc-runtime-binary-sha256.txt
          printf '%s\n' 'H2HC base=cab242d32c988fe5e4e9fd06ebc82ed043541aa2' 'binary_source_run=44165793922' 'local_authority_fallback=false' > runtime-evidence/h2hc-source-pins.txt

      - name: Set up Node 22 for patched HWC
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hwc/package-lock.json

      - name: Instrument ephemeral CI HWC worker for read-only source-chain metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/browser-poc-ci-worker-probe.mjs hwc
          git -C hwc diff --check

      - name: Build patched Chrome extension and verify bundle layout
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          npm ci --prefix hwc 2>&1 | tee runtime-evidence/hwc-npm-install.log
          # Agent 2 CI-green integration builds shared + Lair declarations first.
          # The root build:extension script's order is not valid from a clean checkout.
          (
            cd hwc
            npx tsc -p packages/shared/tsconfig.json
            npx tsc -p packages/lair/tsconfig.json
            npx tsc -p packages/core/tsconfig.json
            npx tsc --noEmit -p packages/extension/tsconfig.json
            npm run build:chrome --workspace @hwc/extension
          ) 2>&1 | tee runtime-evidence/hwc-extension-build.log
          test -s hwc/packages/extension/dist-chrome/manifest.json
          test -s hwc/packages/extension/dist-chrome/inject/index.js
          test -s hwc/packages/extension/dist-chrome/background/index.js
          test -s hwc/packages/extension/dist-chrome/offscreen/ribosome-worker.js
          (cd hwc/packages/extension/dist-chrome && find . -type f -print0 | sort -z | xargs -0 sha256sum) > runtime-evidence/patched-chrome-sha256.txt
          test -s runtime-evidence/patched-chrome-sha256.txt
          printf '%s\n' 'This Chrome extension was freshly built from the verified HWC migration. CI-only probe included. NOT DEPLOYABLE.' > runtime-evidence/EXTENSION-CI-ONLY-NOT-DEPLOYABLE.txt

      - name: Install Playwright Chromium plus headed test prerequisites
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          (cd hwc && npx playwright install --with-deps chromium) 2>&1 | tee runtime-evidence/playwright-install.log
          command -v xvfb-run

      - name: Install pinned Nix with Holochain 0.7.0 binary cache
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            substituters = https://holochain-ci.cachix.org https://cache.nixos.org
            trusted-public-keys = holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            max-jobs = 2
            cores = 2

      - name: Resolve exact pinned Holochain build toolchain
        shell: bash
        timeout-minutes: 28
        run: |
          set -euo pipefail
          git diff --exit-code 111e6a44795e6572ed01191a98245ed723788c12 HEAD -- Cargo.toml Cargo.lock flake.nix flake.lock dnas/game
          timeout --signal=TERM --kill-after=60s 1550s nix -L develop --no-write-lock-file --command bash -c 'hc --version; cargo --version; node --version' 2>&1 | tee runtime-evidence/pinned-toolchain.log

      - name: Real HWC Lair key, host-bound rebuild, install and game zome calls
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Secrets exist only in the runner process and the protected H2HC service.
          # Browser pages see only loopback H2HC_BASE_URL; NEVER inject this secret or tokens.
          export H2HC_LINKER_ADMIN_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$H2HC_LINKER_ADMIN_SECRET"
          export H2HC_LINKER_ADDRESS=127.0.0.1
          export H2HC_LINKER_PORT=8090
          export H2HC_LINKER_KEY_FILE="$RUNNER_TEMP/h2hc-ephemeral-identity.key"
          export H2HC_LINKER_BOOTSTRAP_URL=https://dev-test-bootstrap2.holochain.org/
          export H2HC_LINKER_RELAY_URL=https://dev-test-bootstrap2.holochain.org/
          export H2HC_LINKER_ALLOW_INSECURE_DEV=false
          export H2HC_LINKER_LOCAL_AUTHORITY_FALLBACK=false
          export H2HC_BASE_URL=http://127.0.0.1:8090
          export H2HC_SERVER_LOG="$GITHUB_WORKSPACE/runtime-evidence/h2hc-server.log"
          test "$H2HC_LINKER_ALLOW_INSECURE_DEV" = false
          test "$H2HC_LINKER_LOCAL_AUTHORITY_FALLBACK" = false
          RUST_LOG="h2hc_linker=info,kitsune2=warn,iroh=warn" \
            h2hc-binary/h2hc-linker-linux-x86_64 --address 127.0.0.1 --port 8090 \
            > "$H2HC_SERVER_LOG" 2>&1 &
          H2HC_PID=$!
          trap 'kill "$H2HC_PID" 2>/dev/null || true; wait "$H2HC_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8090/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$H2HC_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" = 1 || { echo 'Secure H2HC gateway did not start'; exit 1; }
          echo "Three genuine Chromium/HWC profiles; identity, H2HC auth and local privacy gates required."
          timeout --signal=TERM --kill-after=60s 1680s xvfb-run -a node scripts/browser-poc-hwc-smoke.mjs 2>&1 | tee runtime-evidence/hwc-runtime-smoke.log

      - name: Upload CI-only instrumented Chrome build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-ONLY-INSTRUMENTED-HWC-CHROME-extension-NOT-DEPLOYABLE
          retention-days: 14
          if-no-files-found: warn
          path: |
            hwc/packages/extension/dist-chrome/
            runtime-evidence/patched-chrome-sha256.txt

      - name: Upload first real browser failure or success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-HWC-first-Imposter-WASM-smoke-evidence
          retention-days: 14
          if-no-files-found: warn
          path: runtime-evidence/

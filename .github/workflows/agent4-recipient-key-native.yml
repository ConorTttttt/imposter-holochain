name: Agent 4 — native RoleCommit game boundary acceptance
on:
  push:
    branches: [feature/browser-compatibility-harness]
    paths:
      - '.github/workflows/agent4-recipient-key-native.yml'
      - 'dnas/game/zomes/integrity/game_integrity/src/**'
      - 'dnas/game/zomes/coordinator/game/src/**'
      - 'tests/tests/full_round.rs'
      - 'scripts/browser-poc-build.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent4-native-recipient-key-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-key-attestation:
    name: Real native Holochain 0.7 — exact RoleCommit, DHT joins and negative gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            substituters = https://holochain-ci.cachix.org https://cache.nixos.org
            trusted-public-keys = holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            max-jobs = 2
            cores = 2
      - name: Compile installed-DNA native WASM and separate forge-negative test DNA
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          nix -L develop --no-write-lock-file --command bash -euo pipefail -c '
            bash scripts/build-forge-dna.sh
            test -s dnas/game/workdir/game.dna
            test -s tests/forge/game.dna
          ' 2>&1 | tee rolecommit-build.log
      - name: Native independent RoleCommit read and malformed author/lobby/seat/join/stale rejection
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          nix -L develop --no-write-lock-file --command cargo test --locked -p game_tests --test full_round native_game_role_commit_boundary -- --nocapture 2>&1 | tee rolecommit-native.log
          for gate in NATIVE_GAME_VALID_LOBBY_AND_JOINS NATIVE_GAME_EXACT_COMMIT_INDEPENDENT_READ NATIVE_GAME_NO_SIGNAL_COMMIT_AND_IDEMPOTENT_RETRY NATIVE_GAME_WRONG_HOST_DENIED NATIVE_GAME_WRONG_LOBBY_DENIED NATIVE_GAME_WRONG_RECIPIENT_SEAT_DENIED NATIVE_GAME_STALE_COMMIT_DENIED NATIVE_GAME_MISMATCHED_JOIN_NATIVE_INVALID NATIVE_GAME_INVALID_RECORD_FAIL_CLOSED; do
            grep -Fq "$gate=PASS" rolecommit-native.log
          done
          grep -Eq '^NATIVE_ROLE_COMMIT_ACTION=uhCkk[A-Za-z0-9_-]+' rolecommit-native.log
      - name: Publish diagnostic logs (no secret key material)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent4-rolecommit-native-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            rolecommit-build.log
            rolecommit-native.log

name: Agent 2 - genuine pinned HWC Lair role signing (NOT installed-cell delivery)

on:
  push:
    branches: [validation/agent2-hwc-integration]
    paths:
      - '.github/workflows/agent2-role-lair-signing.yml'
      - 'compatibility/hwc-imposter-compatibility/private-role/**'
  pull_request:
    paths:
      - '.github/workflows/agent2-role-lair-signing.yml'
      - 'compatibility/hwc-imposter-compatibility/private-role/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-lair-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin exact upstream HWC source
        uses: actions/checkout@v4
        with:
          repository: Holo-Host/holo-web-conductor
          ref: 0c391226e78769d44ccb4661881ed8998b15f903
          path: hwc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hwc/package-lock.json
      - name: Install and build the original real Lair implementation
        run: |
          set -euo pipefail
          npm ci --prefix hwc
          npm run build --prefix hwc --workspace=@holo-host/lair
      - name: Real Lair signs exact role key and delivery transcripts
        run: |
          set -euo pipefail
          node compatibility/hwc-imposter-compatibility/private-role/lair-signing-acceptance.mjs
      - name: Fail-closed acceptance scope
        run: echo 'GENUINE_LAIR_ONLY; installed DNA, authenticated key enrollment and remote receiver still disabled'

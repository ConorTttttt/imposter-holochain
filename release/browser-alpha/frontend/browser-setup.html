<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Imposter browser setup</title>
  <style>
    :root { color-scheme:dark; font:16px/1.55 system-ui,sans-serif; background:#0b1120; color:#eef4ff }
    body { margin:0; padding:24px }
    main { max-width:680px; margin:32px auto }
    section { background:#152037; border:1px solid #344563; border-radius:16px; padding:24px }
    h1 { margin:0 0 20px; font-size:2rem }
    p,label { color:#adbed8 }
    button,a { display:inline-block; padding:9px 16px; background:#3378e9; color:#fff; border:0;
      border-radius:8px; font:inherit; font-weight:650; text-decoration:none; cursor:pointer }
    button:disabled { opacity:.55; cursor:wait }
    :focus-visible { outline:3px solid #8bbcff; outline-offset:3px }
    input { box-sizing:border-box; width:100%; margin:6px 0 12px; padding:10px;
      background:#0b1426; color:#fff; border:1px solid #587095; border-radius:6px; font:inherit }
    #status[data-error="true"] { color:#ffb3b3 }
    [hidden] { display:none }
  </style>
</head>
<body>
  <main>
    <h1>Imposter browser setup</h1>
    <section aria-label="Player setup">
      <p>Open this page in your own Chromium profile with the operator’s Holo Web Conductor extension installed.</p>
      <button id="connect" type="button">Connect HWC</button>
      <p id="status" role="status" aria-live="polite">Connect to create or recover your player identity.</p>
      <div id="identity" hidden>
        <label for="public-key">Your public player key</label>
        <input id="public-key" readonly spellcheck="false" autocomplete="off">
        <button id="copy" type="button">Copy public key</button>
        <p>Share this public key with the operator so they can admit this profile.</p>
      </div>
      <button id="provision" type="button" hidden>Install game and connect</button>
      <a id="lobby" href="/browser-demo.html" hidden>Open lobby</a>
    </section>
  </main>
  <script type="module" src="/browser-setup.js"></script>
</body>
</html>

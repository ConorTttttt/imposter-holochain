[package]
name = "game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Coordinator zome for the per-lobby Imposter DNA: lobby setup, hidden role dealing over remote signals, tasks, meetings, commit-reveal voting, and the end-of-game result."

[lib]
name = "game"
crate-type = ["cdylib", "rlib"]

[dependencies]
hdk = { workspace = true }
holochain_serialized_bytes = { workspace = true }
serde = { workspace = true }
imposter-core = { workspace = true }
game_integrity = { workspace = true }
sha2 = { workspace = true }

[features]
# Test-only: adds `forge_link` / `forge_delete_link`, which write raw links the
# way a tampered client could. Built into tests/forge/game-forge.dna by
# scripts/build-forge-dna.sh for the sweettests; never part of the hApp.
forge = []

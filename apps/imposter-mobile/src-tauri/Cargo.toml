[package]
name = "imposter_mobile"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "imposter_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep the Tauri Android shell independent of the game zomes' 0.7.0 workspace.
[workspace]
resolver = "2"

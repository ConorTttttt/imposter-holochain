<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imposter</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #0b0f17;
        color: #e6edf3;
        display: flex;
        justify-content: center;
      }
      #app { width: 100%; max-width: 900px; padding: 24px 16px 64px; }
      h1 { font-size: 18px; margin: 0 0 16px; letter-spacing: 0.04em; }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #1c2431;
        color: #e6edf3;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #263041; }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { background: #2f81f7; border-color: #2f81f7; color: #fff; }
      input, select {
        font: inherit;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6edf3;
      }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .card { background: #111722; border: 1px solid #232c3b; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
      .muted { color: #8b949e; }
      .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid #30363d; }
      .impostor { color: #ff6b6b; border-color: #ff6b6b; }
      .crew { color: #57c7ff; border-color: #57c7ff; }
      .dead { text-decoration: line-through; opacity: 0.5; }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid #30363d; color: #8b949e; white-space: nowrap; }
      .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .pill.ok { color: #3fb950; border-color: #238636; }
      .pill.ok::before { box-shadow: 0 0 6px currentColor; }
      .pill.warn { color: #d29922; border-color: #9e6a03; }
      .pill.bad { color: #ff6b6b; border-color: #b62324; }
      .banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; }
      .banner.ok { border-color: #238636; }
      .banner.warn { border-color: #9e6a03; }
      .banner.bad { border-color: #b62324; }
      .live { font-size: 12px; color: #8b949e; }
      .live.on { color: #3fb950; }
      .key { display: inline-block; margin-left: 6px; padding: 0 5px; font-size: 11px; line-height: 16px; border: 1px solid #30363d; border-radius: 4px; color: #8b949e; }
      #audio { justify-content: space-between; margin-bottom: 12px; }
      #play { position: relative; }
      #minigame { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: min(440px, 92%); z-index: 2; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
      .mg-track { position: relative; height: 10px; margin: 14px 0 6px; background: #1c2431; border-radius: 5px; }
      .mg-target { position: absolute; top: -5px; width: 4px; height: 20px; margin-left: -2px; background: #d0a72c; border-radius: 2px; }
      .mg-gauge { height: 16px; margin: 10px 0; background: #1c2431; border-radius: 8px; overflow: hidden; }
      .mg-fill { height: 100%; background: #d0a72c; }
      .mg-dial { position: relative; width: 150px; height: 150px; margin: 10px auto; border-radius: 50%; border: 2px solid #30363d; }
      .mg-needle { position: absolute; left: 71.5px; top: 8px; width: 3px; height: 65px; background: #e6edf3; transform-origin: 1.5px 65px; }
      .mg-cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
      .mg-cell { height: 44px; }
      .mg-cell.red { background: #b62324; border-color: #ff6b6b; }
      .mg-map { position: relative; height: 170px; margin: 10px 0; background: #0d1524; border-radius: 8px; }
      .mg-point { position: absolute; transform: translate(-50%, -50%); padding: 4px 9px; }
      .mg-point.done { background: #238636; border-color: #3fb950; }
      .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; border: 1px solid #0b0f17; vertical-align: middle; }
      .swatch.anon { background: #6e7681; }
      .votes td { padding: 3px 12px 3px 0; }
      .eject {
        position: relative; overflow: hidden; padding: 112px 12px 18px; margin-bottom: 12px; border-radius: 10px; text-align: center;
        background: linear-gradient(#1e2d4a55 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, #1e2d4a55 1px, transparent 1px) 0 0 / 28px 28px, #060911;
      }
      .eject-net { position: absolute; top: 56px; left: 50%; width: 0; height: 0; }
      .eject-spoke { position: absolute; left: 0; top: -1px; width: 70px; height: 2px; transform-origin: 0 50%; transform: rotate(var(--a)); background: repeating-linear-gradient(90deg, #58a6ff 0 6px, transparent 6px 10px); animation: eject-sever 2.6s ease forwards; }
      .eject-spoke::after { content: ""; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #58a6ff; }
      .eject-node { position: absolute; left: -22px; top: -25px; width: 44px; height: 50px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--c); animation: eject-drop 2.6s ease forwards; }
      .eject-line { margin: 0; font-size: 20px; clip-path: inset(0 100% 0 0); animation: eject-type 1.6s steps(24) 1.2s forwards; }
      .eject-detail { margin: 8px 0 0; opacity: 0; animation: eject-fade 0.6s ease forwards; }
      @keyframes eject-sever { 0%, 45% { opacity: 1; } 60% { opacity: 1; transform: rotate(var(--a)) scaleX(1.15); } 100% { opacity: 0; transform: rotate(var(--a)) scaleX(0.3); } }
      @keyframes eject-drop { 0%, 45% { opacity: 1; filter: none; transform: none; } 55% { filter: brightness(2.2); } 100% { opacity: 0.12; filter: grayscale(1); transform: scale(0.7); } }
      @keyframes eject-type { to { clip-path: inset(0 0 0 0); } }
      @keyframes eject-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .eject-spoke, .eject-node { animation: none; }
        .eject-spoke { opacity: 0; }
        .eject-node { opacity: 0.12; filter: grayscale(1); }
        .eject-line, .eject-detail { animation: none; clip-path: none; opacity: 1; }
      }
      button.on { border-color: #238636; color: #3fb950; }
      canvas { width: 100%; background: #060911; border: 1px solid #232c3b; border-radius: 12px; display: block; touch-action: none; }
      table { width: 100%; border-collapse: collapse; }
      td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1e2733; }
      #chat-log { max-height: 240px; overflow-y: auto; margin-bottom: 10px; }
      .chat-line { padding: 3px 0; overflow-wrap: anywhere; }
      .chat-line.mine strong { color: #57c7ff; }
      #chat-form input { flex: 1; min-width: 0; }
      #chat-form input:disabled { opacity: 0.6; }

      /* Player-facing join and lobby design */
      .entry-heading { text-align: center; margin: 54px 0 30px; }
      .entry-heading h1 { font-size: clamp(36px, 7vw, 56px); font-weight: 900; letter-spacing: .18em; margin: 0; color: #f3f7ff; text-shadow: 0 0 34px #597bc25a; }
      .entry-heading p { color: #8394af; font-size: 11px; letter-spacing: .26em; margin: 8px 0 0; }
      .entry-card { max-width: 560px; margin: 0 auto; padding: 24px; border-radius: 20px; background: linear-gradient(145deg, #162235, #0f1725 72%); border-color: #334159; box-shadow: 0 25px 60px #0006; }
      .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #0b111d; border-radius: 12px; padding: 4px; margin-bottom: 22px; }
      .mode-tabs button { border: 0; background: transparent; color: #96a4b9; padding: 12px; font-weight: 650; }
      .mode-tabs button.selected { background: #293b56; color: white; box-shadow: 0 2px 8px #0004; }
      .entry-fields { display: grid; gap: 15px; margin-bottom: 20px; }
      .entry-fields label { color: #a8b8d0; font-size: 11px; font-weight: 750; letter-spacing: .12em; }
      .entry-fields input { display: block; width: 100%; margin-top: 7px; padding: 13px 14px; font-size: 16px; background: #0a1220; border-color: #30415a; }
      .entry-fields input:focus, .entry-host-options select:focus { outline: 2px solid #6a99f0; outline-offset: 2px; }
      .entry-host-options { margin-bottom: 18px; border-top: 1px solid #31405a; padding-top: 18px; }
      .entry-host-options .row { gap: 12px; }
      .entry-host-options button { font-size: 12px; padding: 7px 10px; }
      .entry-option-row { padding: 14px 0 8px; }
      .entry-option-row label { flex: 1; min-width: 105px; font-size: 12px; color: #c4d1e5; }
      .entry-option-row select { width: 100%; display: block; margin-top: 5px; }
      .entry-host-options p { font-size: 12px; margin: 6px 0 0; }
      .entry-actions button { display: block; width: 100%; padding: 14px 18px; margin-top: 16px; font-size: 16px; font-weight: 750; }
      .entry-card .banner { background: #101e30; border-color: #30415a; font-size: 12px; }
      .entry-card .banner .pill { flex-shrink: 0; }
      .entry-footnote { text-align: center; color: #8c9bb1; font-size: 12px; margin: 14px 0 0; }
      .lobby-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
      .lobby-heading h1 { font-size: 26px; margin: 0; letter-spacing: .1em; }
      .lobby-heading p { margin: 4px 0 0; }
      .lobby-heading .pill { font-size: 12px; }
      .lobby-summary { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #29374d; padding-bottom: 15px; }
      .lobby-summary strong { font-size: 17px; }
      .lobby-summary span { color: #9eafc4; }
      .lobby-subheading { margin: 20px 0 10px; font-size: 14px; font-weight: 750; color: #dce8fb; }
      .player-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 9px; }
      .player-tile { display: flex; align-items: center; gap: 6px; background: #182437; border: 1px solid #30405a; border-radius: 10px; min-height: 52px; padding: 9px 12px; }
      .player-tile.empty { color: #8696aa; border-style: dashed; background: #101722; }
      .player-tag { margin-left: auto; font-size: 10px; font-weight: 750; color: #adcaf4; letter-spacing: .07em; }
      .player-tag + .player-tag { margin-left: 3px; }
      .lobby-settings { margin-top: 20px; padding-top: 4px; border-top: 1px solid #29374d; }
      .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 12px 0; }
      .settings-grid label { display: flex; flex-direction: column; gap: 5px; color: #c2d2e8; font-size: 12px; }
      .settings-grid select { width: 100%; }
      .settings-grid span { border: 1px solid #293a50; background: #0e1827; padding: 10px; border-radius: 8px; font-size: 12px; }
      .settings-grid strong { color: #f0f6ff; }
      .settings-note { font-size: 12px; margin: 8px 0 12px; }
      .settings-toggle { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 11px 14px; font-weight: 700; background: #1a2a40; }
      .settings-toggle span { color: #92a6c5; }
      .lobby-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin: 22px 0 0; }
      .lobby-footer button { padding: 11px 22px; font-weight: 700; }
      .settings-hud-btn { padding: 4px 8px; font-size: 12px; }
      .gameplay-settings { margin-top: 10px; padding: 14px; }
      @media (max-width: 560px) {
        #app { padding: 14px 12px 50px; }
        .entry-heading { margin-top: 32px; }
        .entry-card { padding: 17px; }
        .entry-heading h1 { font-size: 34px; }
        .lobby-heading h1 { font-size: 21px; }
        .player-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app">loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
